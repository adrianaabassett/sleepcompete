<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepCompete - Login</title>
</head>
<body>
    <header>
        <h1>SleepCompete</h1>
    </header>
    
    <nav>
        <a href="index.html">Home</a> | 
        <a href="login.html">Login</a> | 
        <a href="dashboard.html">Dashboard & Leaderboard</a>
    </nav>
    
    <main>
        <h2>Login to Your Account</h2>
        
        <!-- Authentication / Login Placeholder -->
        <form action="dashboard.html" method="get">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <br>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <br>
            <button type="submit">Login</button>
        </form>
    </main>
    
    <footer>
        <hr>
        <p>Created by Adriana Bassett</p>
        <a href="https://github.com/adrianaabassett/sleepcompete">GitHub Repository</a>
    </footer>
</body>
</html>
